<!DOCTYPE html>

<html lang="km">

<head>

<meta charset="utf-8">

<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>ផ្ទៀងផ្ទាត់ ABA ជាមួយបំណុលគ្រូពេទ្យ</title>

<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Khmer:wght@400;600;700&display=swap" rel="stylesheet">

<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

:root{--bg:#f0f2f5;--card:#fff;--tx:#1b2430;--mu:#5f6b7a;--bd:#cfd6de;--pr:#0b6bcb;--ok:#14803c;--wa:#b26a00;--er:#c62828;box-sizing:border-box}

/* Print Modal Styles */
.modal-overlay{position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,0.6);z-index:9999;display:none;align-items:center;justify-content:center;padding:15px;backdrop-filter:blur(2px)}
.modal-overlay.active{display:flex}
.modal-card{background:#fff;color:#1b2430;border-radius:10px;width:100%;max-width:980px;max-height:92vh;display:flex;flex-direction:column;box-shadow:0 10px 30px rgba(0,0,0,0.3);overflow:hidden}
.modal-header{display:flex;justify-content:space-between;align-items:center;padding:10px 16px;border-bottom:1px solid #e2e8f0;background:#f8fafc;flex-wrap:wrap;gap:8px}
.modal-header h3{margin:0;font-size:1.05rem;color:#0f172a}
.modal-actions{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.modal-body{padding:20px;overflow-y:auto;flex:1;background:#fff}
.print-paper{background:#fff;color:#000;font-family:'Noto Sans Khmer',system-ui,sans-serif;font-size:13px;line-height:1.4;padding:10px}
.print-table{width:100%;border-collapse:collapse;margin-top:12px;font-size:12px}
.print-table th,.print-table td{border:1px solid #cbd5e1;padding:6px 8px;text-align:left}
.print-table th{background:#f1f5f9;font-weight:600;color:#0f172a}
.print-table th.n,.print-table td.n{text-align:right}
.print-table tfoot td{font-weight:bold;background:#f8fafc}
@media print{
  body *{visibility:hidden !important}
  #printDocument,#printDocument *{visibility:visible !important}
  #printModal{display:block !important;position:absolute !important;left:0 !important;top:0 !important;width:100% !important;height:auto !important;background:#fff !important;padding:0 !important;margin:0 !important;box-shadow:none !important}
  #printModal .modal-header{display:none !important}
  #printModal .modal-body{padding:0 !important;overflow:visible !important}
  #printDocument{position:absolute !important;left:0 !important;top:0 !important;width:100% !important;margin:0 !important;padding:15px !important}
  .print-table th,.print-table td{border:1px solid #333 !important}
}

@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12161c;--card:#1b222b;--tx:#e8ecf1;--mu:#94a0b0;--bd:#2d3744;--pr:#5aa8ff;--ok:#4cc38a;--wa:#f0b24a;--er:#ff7b7b}}

html{scroll-padding-top:env(safe-area-inset-top,0px)}

*{box-sizing:border-box}

body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans Khmer",system-ui,sans-serif;line-height:1.4;font-size:14px}

main{max-width:1200px;margin:0 auto;padding:10px}

h1{font-size:1.15rem;margin:0 0 2px}h2{font-size:0.95rem;margin:0 0 6px}

.mu{color:var(--mu);font-size:.78rem}

.card{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:10px;margin-bottom:10px;box-shadow:0 1px 2px rgba(0,0,0,0.03)}

.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}

button,select,input{font:inherit;color:var(--tx);font-size:.85rem}

button{background:var(--card);border:1px solid var(--bd);border-radius:6px;padding:5px 10px;cursor:pointer;transition:all .15s}

button:hover{background:var(--bg)}

button.p,button.on{background:var(--pr);border-color:var(--pr);color:#fff}

button.p:hover{background:#0a5aab}

button:disabled{opacity:.45;cursor:not-allowed}

input[type=date],select,input[type=text]{background:var(--bg);border:1px solid var(--bd);border-radius:6px;padding:4px 6px;height:28px}

input[type=file]{font-size:.75rem;max-width:100%}

.up{flex:1 1 200px;border:1px dashed var(--bd);border-radius:6px;padding:8px;background:var(--bg)}

.up b{display:block;font-size:.85rem;margin-bottom:2px}

.up .mu{display:block;margin-bottom:4px;font-size:.7rem}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}

.kpi{background:var(--bg);border-radius:6px;padding:8px}.kpi span{display:block;font-size:.75rem;color:var(--mu)}.kpi strong{font-size:1.05rem}

.tw{overflow-x:auto}

table{width:100%;border-collapse:collapse;font-size:.8rem;min-width:600px}

th,td{padding:4px 6px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}

td.n,th.n{text-align:right}

details{border:1px solid var(--bd);border-radius:6px;margin-bottom:6px;background:var(--card)}

summary{padding:8px 10px;cursor:pointer;display:flex;flex-wrap:wrap;gap:8px;justify-content:space-between;font-size:.85rem;user-select:none}

summary:hover{background:var(--bg)}

.tag{border-radius:99px;padding:1px 8px;font-size:.7rem;border:1px solid currentColor}

.ok{color:var(--ok)}.wa{color:var(--wa)}.er{color:var(--er)}

.bar{height:4px;background:var(--bd);border-radius:9px;overflow:hidden;margin:0 10px 6px}.bar i{display:block;height:100%;background:var(--ok)}

.pad{padding:0 10px 10px}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;background:var(--card);padding:8px;border-radius:8px;border:1px solid var(--bd);margin-bottom:10px;position:sticky;top:10px;z-index:10;box-shadow:0 2px 5px rgba(0,0,0,0.05)}

</style>

</head>

<body>

<main>

<div style="display:flex;justify-content:space-between;align-items:flex-end;margin-bottom:8px">

  <div><h1>ផ្ទៀងផ្ទាត់ ABA ជាមួយបំណុលគ្រូពេទ្យ</h1><span class="mu">ទាញយក Excel ជាទម្រង់ JV ឬ OR</span></div>

</div>



<div class="card">

<div class="row">

<div class="up" style="position:relative">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
    <b>១. តារាង ABA</b>
    <button type="button" id="delAba" style="display:none;padding:1px 8px;font-size:0.75rem;color:var(--er);border:1px solid #fca5a5;background:#fef2f2;border-radius:4px;cursor:pointer">🗑️ លុប</button>
  </div>
  <span class="mu">Credit, ពិពណ៌នា</span>
  <input type="file" id="fAba" accept=".xlsx,.xls,.csv">
  <div class="mu" id="sAba" style="margin-top:4px"></div>
</div>

<div class="up" style="position:relative">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
    <b>២. តារាងវិក័យបត្រ</b>
    <button type="button" id="delDebt" style="display:none;padding:1px 8px;font-size:0.75rem;color:var(--er);border:1px solid #fca5a5;background:#fef2f2;border-radius:4px;cursor:pointer">🗑️ លុប</button>
  </div>
  <span class="mu">ជ្រើសបានច្រើនឯកសារ</span>
  <input type="file" id="fDebt" accept=".xlsx,.xls,.csv" multiple>
  <div class="mu" id="sDebt" style="margin-top:4px"></div>
</div>

<div class="up" style="position:relative">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2px">
    <b>៣. គណនីគ្រូពេទ្យ</b>
    <button type="button" id="delAcc" style="display:none;padding:1px 8px;font-size:0.75rem;color:var(--er);border:1px solid #fca5a5;background:#fef2f2;border-radius:4px;cursor:pointer">🗑️ លុប</button>
  </div>
  <span class="mu">(ជម្រើស) Entry, Name, Acc</span>
  <input type="file" id="fAcc" accept=".xlsx,.xls,.csv">
  <div class="mu" id="sAcc" style="margin-top:4px"></div>
</div>

</div>

</div>



<div id="mapContainer"></div>



<!-- Sticky Toolbar for Actions & Filters -->

<div class="toolbar">

  <div class="row" style="flex:1">

    <span class="mu" style="margin-right:4px">រយៈពេល៖</span>

    <button data-d="7" class="pb">៧ ថ្ងៃ</button>

    <button data-d="15" class="pb">១៥ ថ្ងៃ</button>

    <button data-d="30" class="pb">១ ខែ</button>

    <button data-d="0" class="pb on">ទាំងអស់</button>

    <input type="date" id="dFrom" title="ពី"> <span>-</span> <input type="date" id="dTo" title="ដល់">

    <input type="text" id="custSearch" placeholder="🔍 ស្វែងរកអតិថិជន (C00007, ឈ្មោះ...)" style="width:230px;height:28px" title="ស្វែងរកតាមលេខកូដ C00007 ឬ ឈ្មោះ">

    <button class="p" id="go" style="margin-left:auto">🔄 ផ្ទៀងផ្ទាត់</button>

  </div>

</div>



<details class="card" style="margin-bottom:10px; border:1px dashed var(--bd);">

  <summary style="font-weight:600; color:var(--mu)">⚙️ ការកំណត់ទម្រង់ Export (ចុចទីនេះដើម្បីកែប្រែ)</summary>

  <div class="row pad" style="padding-top:8px">

    <label class="mu">គណនីធនាគារ <input type="text" id="bank" value="ONG MACH ABA USD" style="width:160px"></label>

    <label class="mu">រូបិយប័ណ្ណ <input type="text" id="cur" value="USD" style="width:60px"></label>

    <label class="mu">អត្រា <input type="text" id="rate" value="1" style="width:60px"></label>

    <label class="mu">ទម្រង់ 

      <select id="fmt">

        <option value="or">AME Receipt (OR)</option>

        <option value="jv">Journal Voucher (JV)</option>

      </select>

    </label>

  </div>

</details>



<div class="row" style="margin-bottom:10px">

  <button class="p" id="exAll">⬇ Export ទាំងអស់ដែលបានសង</button>

  <button id="exSel" style="display:none;background:#e8f0fe;border-color:var(--pr);color:var(--pr);font-weight:600">⬇ Export តាមការធិច (<span id="selNum">0</span>)</button>

  <button id="exUn">⬇ ទាញយក ABA ដែលរកមិនឃើញគ្រូពេទ្យ</button>

</div>



<div id="out"></div>

<!-- Print & Export Modal -->
<div id="printModal" class="modal-overlay">
  <div class="modal-card">
    <div class="modal-header">
      <h3>🖨️ ឯកសារយោងវិក័យបត្រ (Customer Statement / Reference Document)</h3>
      <div class="modal-actions">
        <button class="p" id="btnPrintNow" style="background:#0284c7;border-color:#0284c7;color:#fff">🖨️ បោះពុម្ព (Print / PDF)</button>
        <button id="btnSavePNG" style="background:#059669;border-color:#059669;color:#fff">🖼️ រក្សាទុក PNG</button>
        <button id="btnSaveExcel" style="background:#16a34a;border-color:#16a34a;color:#fff">📊 រក្សាទុក Excel</button>
        <button id="btnSaveCSV" style="background:#475569;border-color:#475569;color:#fff">📄 រក្សាទុក CSV</button>
        <button id="btnCloseModal" style="background:#fee2e2;border-color:#fca5a5;color:#dc2626">✕ បិទ</button>
      </div>
    </div>
    <div id="printModalBody" class="modal-body"></div>
  </div>
</div>

</main>



<script>

// ============================================================================

// 0. LOCAL STORAGE (Save Settings)

// ============================================================================

var $ = id => document.getElementById(id);

var ST_KEYS = { bank: 'aba_bank', cur: 'aba_cur', rate: 'aba_rate', fmt: 'aba_fmt' };



function loadSettings() {

    if(localStorage.getItem(ST_KEYS.bank)) $('bank').value = localStorage.getItem(ST_KEYS.bank);

    if(localStorage.getItem(ST_KEYS.cur)) $('cur').value = localStorage.getItem(ST_KEYS.cur);

    if(localStorage.getItem(ST_KEYS.rate)) $('rate').value = localStorage.getItem(ST_KEYS.rate);

    if(localStorage.getItem(ST_KEYS.fmt)) $('fmt').value = localStorage.getItem(ST_KEYS.fmt);

}



function saveSettings() {

    localStorage.setItem(ST_KEYS.bank, $('bank').value);

    localStorage.setItem(ST_KEYS.cur, $('cur').value);

    localStorage.setItem(ST_KEYS.rate, $('rate').value);

    localStorage.setItem(ST_KEYS.fmt, $('fmt').value);

}



['bank', 'cur', 'rate', 'fmt'].forEach(id => {

    $(id).addEventListener('input', saveSettings);

    $(id).addEventListener('change', saveSettings);

});



loadSettings();

// ============================================================================
// INDEXEDDB PERSISTENCE (Remember files across refresh)
// ============================================================================
var DB_NAME = 'AbaVerifyDB';
var STORE_NAME = 'app_state';

function openDB() {
    return new Promise((resolve, reject) => {
        var req = indexedDB.open(DB_NAME, 1);
        req.onupgradeneeded = e => {
            var db = e.target.result;
            if(!db.objectStoreNames.contains(STORE_NAME)) {
                db.createObjectStore(STORE_NAME);
            }
        };
        req.onsuccess = e => resolve(e.target.result);
        req.onerror = e => reject(e.target.error);
    });
}

function dbSet(key, val) {
    return openDB().then(db => {
        return new Promise((resolve, reject) => {
            var tx = db.transaction(STORE_NAME, 'readwrite');
            var store = tx.objectStore(STORE_NAME);
            var req = store.put(val, key);
            req.onsuccess = () => resolve();
            req.onerror = e => reject(e.target.error);
        });
    }).catch(err => console.warn('dbSet error:', err));
}

function dbGet(key) {
    return openDB().then(db => {
        return new Promise((resolve, reject) => {
            var tx = db.transaction(STORE_NAME, 'readonly');
            var store = tx.objectStore(STORE_NAME);
            var req = store.get(key);
            req.onsuccess = e => resolve(e.target.result);
            req.onerror = e => reject(e.target.error);
        });
    }).catch(err => { console.warn('dbGet error:', err); return null; });
}

function dbDel(key) {
    return openDB().then(db => {
        return new Promise((resolve, reject) => {
            var tx = db.transaction(STORE_NAME, 'readwrite');
            var store = tx.objectStore(STORE_NAME);
            var req = store.delete(key);
            req.onsuccess = () => resolve();
            req.onerror = e => reject(e.target.error);
        });
    }).catch(err => console.warn('dbDel error:', err));
}

// ============================================================================
// STATE & UI PERSISTENCE
// ============================================================================
var FILE_NAMES = {
    aba: localStorage.getItem('aba_file_name') || '',
    debt: localStorage.getItem('debt_file_name') || '',
    acc: localStorage.getItem('acc_file_name') || ''
};

function updateBoxUI() {
    // 1. ABA Box
    var hasAba = !!(RAW.aba && RAW.aba.rows && RAW.aba.rows.length);
    if(hasAba) {
        if($('delAba')) $('delAba').style.display = 'inline-block';
        var nmAba = FILE_NAMES.aba || localStorage.getItem('aba_file_name') || 'ឯកសារ ABA';
        var cntAba = (aba && aba.length) ? aba.length : (RAW.aba.rows ? RAW.aba.rows.length : 0);
        $('sAba').innerHTML = '<span style="color:var(--tx);font-weight:600">' + esc(nmAba) + '</span> <span class="tag ok" style="font-size:0.65rem">បានចងចាំ</span><br>' + cntAba + ' ប្រតិបត្តិការ';
    } else {
        if($('delAba')) $('delAba').style.display = 'none';
        $('sAba').innerHTML = '';
    }

    // 2. Debts Box
    var hasDebt = !!(FILES && FILES.length);
    if(hasDebt) {
        if($('delDebt')) $('delDebt').style.display = 'inline-block';
        var nmDebt = FILE_NAMES.debt || localStorage.getItem('debt_file_name') || (FILES.length + ' ឯកសារ');
        var cntInv = (debts && debts.length) ? debts.length : (FILES.reduce((s, f) => s + (f.rows ? f.rows.length : 0), 0));
        $('sDebt').innerHTML = '<span style="color:var(--tx);font-weight:600">' + esc(nmDebt) + '</span> <span class="tag ok" style="font-size:0.65rem">បានចងចាំ</span><br>' + FILES.length + ' ឯកសារ · ' + cntInv + ' វិក័យបត្រ';
    } else {
        if($('delDebt')) $('delDebt').style.display = 'none';
        $('sDebt').innerHTML = '';
    }

    // 3. Accounts Box
    var hasAcc = !!(ACC && ACC.length);
    if(hasAcc) {
        if($('delAcc')) $('delAcc').style.display = 'inline-block';
        var nmAcc = FILE_NAMES.acc || localStorage.getItem('acc_file_name') || 'ឯកសារគណនី';
        $('sAcc').innerHTML = '<span style="color:var(--tx);font-weight:600">' + esc(nmAcc) + '</span> <span class="tag ok" style="font-size:0.65rem">បានចងចាំ</span><br>' + ACC.length + ' គណនី';
    } else {
        if($('delAcc')) $('delAcc').style.display = 'none';
        $('sAcc').innerHTML = '';
    }
}

function initBoxPlaceholders() {
    if(FILE_NAMES.aba) {
        if($('delAba')) $('delAba').style.display = 'inline-block';
        $('sAba').innerHTML = '<span style="color:var(--tx);font-weight:600">' + esc(FILE_NAMES.aba) + '</span> <span class="tag ok" style="font-size:0.65rem">បានចងចាំ</span>';
    }
    if(FILE_NAMES.debt) {
        if($('delDebt')) $('delDebt').style.display = 'inline-block';
        $('sDebt').innerHTML = '<span style="color:var(--tx);font-weight:600">' + esc(FILE_NAMES.debt) + '</span> <span class="tag ok" style="font-size:0.65rem">បានចងចាំ</span>';
    }
    if(FILE_NAMES.acc) {
        if($('delAcc')) $('delAcc').style.display = 'inline-block';
        $('sAcc').innerHTML = '<span style="color:var(--tx);font-weight:600">' + esc(FILE_NAMES.acc) + '</span> <span class="tag ok" style="font-size:0.65rem">បានចងចាំ</span>';
    }
}

// ============================================================================
// 1. UTILITIES & GLOBALS

// ============================================================================

var num = v => { if(v==null || v==='') return 0; var n = parseFloat(String(v).replace(/[^0-9.\-]/g,'')); return isNaN(n) ? 0 : n; };

var fmt = n => n.toLocaleString('en-US', {maximumFractionDigits:2});

var pd = v => {

    if(v instanceof Date) return isNaN(v) ? null : v;

    if(v == null || v === '') return null;

    if(typeof v === 'number' && v > 20000 && v < 80000) return new Date(Math.round((v - 25569) * 864e5) + new Date().getTimezoneOffset() * 6e4);

    var s = String(v).trim(), m = s.match(/^(\d{1,2})[\/.\-](\d{1,2})[\/.\-](\d{4})/);

    if(m) return new Date(+m[3], +m[2]-1, +m[1]);

    var d = new Date(s); return isNaN(d) ? null : d;

};

var iso = d => d ? d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0') : '';

var MON = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

var dmy = d => {
    if(!d) return '';
    if(typeof d === 'string') {
        var dp = pd(d);
        if(dp) d = dp;
        else return d;
    }
    return (d instanceof Date && !isNaN(d)) ? String(d.getDate()).padStart(2,'0') + '-' + MON[d.getMonth()] + '-' + d.getFullYear() : String(d||'');
};

var esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

var pick = (row, keys, not) => {

    var ks = Object.keys(row);

    for(var i=0; i<keys.length; i++){

        for(var j=0; j<ks.length; j++){

            var k = ks[j].toLowerCase();

            if(k.indexOf(keys[i]) > -1 && !(not && k.indexOf(not) > -1)) return ks[j];

        }

    }

    return null;

};

var isDate = x => x instanceof Date || (typeof x === 'string' && (/^\d{1,4}[\/.\-]\d{1,2}[\/.\-]\d{1,4}/.test(x.trim()) || /^\d{1,2}[\- ][A-Za-z]{3}[\- ]\d{4}/.test(x.trim())));



var debts=[], aba=[], assign={}, sel={}, res=null, ACC=[], ACC_INVOICES=[], FILES=[], HDR={};

var RAW = {aba: null, debt: null}, M = {aba: {}, debt: {}};

var KEYS = {

    aba: { date: ['date','កាល'], text: ['description','remark','detail','narr','particular','ពិពណ៌នា'], ref: ['reference','ref'], cr: ['money in','cash in','credit','received','deposit','ចូល'], am: ['amount'] },

    debt: {
        inv: [
            'invoice no',
            'inv no',
            'invoice number',
            'invoice #',
            'invoice',
            'inv',

function readWB(f, cb) {

    var r = new FileReader();

    r.onload = e => { try { cb(XLSX.read(e.target.result, {type:'array', cellDates:true})) } catch(x) { alert('អានមិនបាន៖ ' + x.message) } };

    r.readAsArrayBuffer(f);

}

function isAgedReportAOA(aoa) {
    if(!aoa || !aoa.length) return false;
    for(var i=0; i<Math.min(aoa.length, 100); i++) {
        var txt = (aoa[i]||[]).join(' ').trim();
        if(/^[A-Z]\d{4,}\s*[-–]/i.test(txt) || /^C\d{4,}\b/i.test(txt)) return true;
    }
    return false;
}

function parseAgedReport(aoa) {
    var bi = -1;
    for(var i=0; i<Math.min(aoa.length, 50); i++) {
        var rowStr = (aoa[i]||[]).join(' ').toLowerCase();
        if((rowStr.includes('entry no') || rowStr.includes('inv')) && (rowStr.includes('module') || rowStr.includes('date'))) {
            bi = i;
            break;
        }
    }
    if(bi === -1) return null;

    var h = (aoa[bi]||[]).map((c, j) => String(c||'').trim() || ('Col'+(j+1)));
    
    var colInv = h.findIndex(k => /entry\s*no|inv/i.test(k));
    var colDate = h.findIndex(k => /^date/i.test(k));
    var colRef = h.findIndex(k => /^ref/i.test(k));
    var colMod = h.findIndex(k => /module|source/i.test(k));
    var colDesc = h.findIndex(k => /remark|desc|particular/i.test(k));
    
    var colBal = h.findIndex(k => /^balance$/i.test(k));
    if(colBal < 0) colBal = h.findIndex(k => /balance/i.test(k));
    if(colBal < 0) colBal = h.findIndex(k => /^current\s*amount$/i.test(k));
    if(colBal < 0) colBal = h.findIndex(k => /^amount$/i.test(k));

    var currentCust = '';
    var currentCustCode = '';
    var rows = [];
    var custRunningBal = {};
    var custInvoiceIndex = {};

    for(var i = bi + 1; i < aoa.length; i++) {
        var r = aoa[i];
        if(!r || !r.length) continue;
        var firstCell = String(r[0]||'').trim();
        var rowText = r.map(x => String(x||'').trim()).filter(Boolean).join(' ');

        var custMatch = firstCell.match(/^([A-Z]\d{4,})\s*[-–]\s*(.+)$/i) || 
                        rowText.match(/^([A-Z]\d{4,})\s*[-–]\s*(.+)$/i) || 
                        firstCell.match(/^([A-Z]\d{4,})\b/i);
        if(custMatch) {
            currentCustCode = custMatch[1].trim();
            currentCust = custMatch[2] ? (custMatch[1] + ' - ' + custMatch[2]).trim() : firstCell;
            custRunningBal[currentCust] = 0;
            custInvoiceIndex[currentCust] = 0;
            continue;
        }

        var invVal = colInv >= 0 ? String(r[colInv]||'').trim() : '';
        if(/^INV/i.test(invVal) || (colMod >= 0 && /AR-IN/i.test(String(r[colMod]||'')) && invVal)) {
            var amt = colBal >= 0 ? parseFloat(String(r[colBal]).replace(/[^0-9.-]/g,'')) : 0;
            if(isNaN(amt)) amt = 0;

            custRunningBal[currentCust] = (custRunningBal[currentCust] || 0) + amt;
            custInvoiceIndex[currentCust] = (custInvoiceIndex[currentCust] || 0) + 1;

            var obj = {
                'Customer Name': currentCust,
                'Customer ID': currentCustCode,
                'No': custInvoiceIndex[currentCust],
                'Module': colMod >= 0 ? String(r[colMod]||'').trim() : 'AR-IN',
                'Entry No': invVal,
                'Invoice No': invVal,
                'Reference': colRef >= 0 ? String(r[colRef]||'').trim() : '',
                'Date': colDate >= 0 ? r[colDate] : '',
                'Description': colDesc >= 0 ? String(r[colDesc]||'').trim() : '',
                'Amount': amt,
                'Running Balance': Math.round(custRunningBal[currentCust] * 100) / 100
            };

            h.forEach((k, j) => {
                if(!obj[k]) obj[k] = r[j];
            });

            rows.push(obj);
        }
    }

    return {
        h: ['Customer Name', 'Customer ID', 'No', 'Module', 'Entry No', 'Invoice No', 'Reference', 'Date', 'Description', 'Amount', 'Running Balance'].concat(h),
        rows: rows,
        isAgedReport: true
    };
}

function sheetsOf(wb) {
    return wb.SheetNames.map(n => {
        var a = XLSX.utils.sheet_to_json(wb.Sheets[n], {header:1, defval:'', raw:true});
        if(!a.length) return null;
        if(isAgedReportAOA(a)) {
            var t = parseAgedReport(a);
            if(t) return t;
        }
        return mkTable(a);
    }).filter(Boolean);
}

function hasH(t, re) { return t.h.some(h => re.test(h)); }

function mkTable(aoa) {

    var re = /date|credit|debit|amount|description|remark|detail|invoice|reference|name|vendor|customer|balance|doctor|កាល|ចំនួន|ពិពណ៌នា|វិក័យ|ឈ្មោះ/i, bi=0, bs=-1;

    for(var i=0; i<Math.min(aoa.length, 50); i++) {

        var sc = 0; aoa[i].forEach(c => { if(typeof c === 'string' && c.trim()) { sc++; if(re.test(c)) sc+=10; } });

        if(sc > bs) { bs = sc; bi = i; }

    }

    var h = (aoa[bi]||[]).map((c, j) => String(c||'').trim() || ('Col'+(j+1)));

    var rows = aoa.slice(bi+1).filter(r => r.some(c => c !== '')).map(r => { var o={}; h.forEach((k,j) => { o[k] = r[j] }); return o; });

    return {h: h, rows: rows};

}

function colInfo(t) {

    return t.h.map(h => {

        var v = t.rows.slice(0, 60).map(r => r[h]).filter(x => x !== '' && x != null), n = v.length || 1;

        return { h: h, n: n, v: v, num: v.filter(x => typeof x === 'number' || (typeof x === 'string' && /^[\s\-\d.,$]+$/.test(x) && /\d/.test(x))).length/n, dt: v.filter(isDate).length/n, len: v.reduce((s, x) => s + String(x).length, 0)/n };

    });

}

function smart(kind, t) {

    var m = {}, f = {}; t.h.forEach(k => { f[k] = 1 });

    Object.keys(KEYS[kind]).forEach(k => { var c = pick(f, KEYS[kind][k]); if(c) m[k] = c; });

    var ci = colInfo(t), used = c => Object.keys(m).some(k => m[k] === c), c;

    if(!m.date) { c = ci.filter(x => x.dt > 0.6 && !used(x.h))[0]; if(c) m.date = c.h; }

    if(kind === 'aba') {

        if(!m.cr && !m.am) { c = ci.filter(x => x.num > 0.6 && x.dt < 0.3 && !/bal|out|debit|ចេញ/i.test(x.h) && !used(x.h))[0]; if(c) m.cr = c.h; }

        if(!m.text) { c = ci.filter(x => x.num < 0.3 && x.dt < 0.3 && !used(x.h)).sort((a,b) => b.len - a.len)[0]; if(c) m.text = c.h; }

    } else {

        // Safety: Ensure m.inv is NOT equal to m.entry if another invoice column exists
        if(m.inv && m.entry && m.inv === m.entry) {
            var alt = t.h.find(h => h !== m.entry && /inv|វិក័យ|វិក្កយ|bill|doc/i.test(h));
            if(!alt) {
                var ivc = ci.find(x => x.h !== m.entry && x.v.filter(y => /^[A-Za-z]{1,6}[-\s]?[A-Za-z0-9\-]*\d{2,}$/.test(String(y).trim())).length / x.n > 0.4);
                if(ivc) alt = ivc.h;
            }
            if(alt) m.inv = alt; else m.inv = '';
        }

        // If invoice column is still missing, auto-detect by header keywords or cell patterns
        if(!m.inv) {
            var invH = t.h.find(h => /inv|វិក័យ|វិក្កយ|bill|doc/i.test(h) && (!m.entry || h !== m.entry));
            if(invH) {
                m.inv = invH;
            } else {
                c = ci.filter(x => x.v.filter(y => /^[A-Za-z]{1,6}[-\s]?[A-Za-z0-9\-]*\d{3,}$/.test(String(y).trim())).length/x.n > 0.5 && (!m.entry || x.h !== m.entry))[0];
                if(c) m.inv = c.h;
            }
        }

        if(!m.db && !m.cr && !m.bal) { c = ci.filter(x => x.num > 0.6 && x.dt < 0.3 && !used(x.h)).pop(); if(c) m.cr = c.h; }

    }

    return m;

}

function ingestAcc(t) {

    var fk = {}; t.h.forEach(k => { fk[k] = 1 });

    var kn = pick(fk, ['customer name','doctor name','doctor','name','ឈ្មោះ','party']);
    if(!kn) kn = pick(fk, ['customer id','customer no','customer','entry no','entry','code']);

    var ka = pick(fk, ['accound aba','aba account','aba acc','account no','aba no','aba','bank acc','acct','acc']);
    var ke = pick(fk, ['entry no','entry','source entry no','jv no','jv','code']);
    var kcid = pick(fk, ['customer id','customer no','customer','code']);
    var kc = pick(fk, ['class id','class']);
    var kb = pick(fk, ['cash/bank account id','cash/bank account','bank account id','bank account','bank','cash/bank']);

    t.rows.forEach(x => {

        var entryVal = String(x[ke]||'').trim();
        var custVal = String(x[kcid]||'').trim();
        var nameVal = String(x[kn]||'').trim();
        var accVal = String(x[ka]||'').replace(/\D/g,'');
        var classVal = String(x[kc]||'').trim();
        var bankVal = String(x[kb]||'').trim();

        if(!nameVal && custVal) nameVal = custVal;
        if(!nameVal && entryVal) nameVal = entryVal;

        if(!entryVal && !nameVal && !custVal) return;

        // If HDR has additional metadata for this entry, merge it
        if(entryVal && HDR[entryVal]) {
            if(!custVal) custVal = String(HDR[entryVal]['Customer ID'] || HDR[entryVal]['Customer'] || '').trim();
            if(!classVal) classVal = String(HDR[entryVal]['Class ID'] || HDR[entryVal]['Class'] || '').trim();
            if(!bankVal) bankVal = String(HDR[entryVal]['Cash/Bank Account ID'] || HDR[entryVal]['Cash/Bank Account'] || '').trim();
        }

        var a = {
            raw: x,
            entry: entryVal,
            name: nameVal,
            acct: accVal,
            customerId: custVal,
            classId: classVal,
            bankAcc: bankVal
        };

        var existing = ACC.find(o => (entryVal && o.entry && o.entry === entryVal) ||
                                     (custVal && o.customerId && o.customerId === custVal) ||
                                     (nameVal && o.name && o.name.toLowerCase() === nameVal.toLowerCase()));

        if(existing) {
            if(nameVal && (!existing.name || /^(OR\d+|C\d+|DEFAULT|\d+)$/i.test(existing.name))) existing.name = nameVal;
            if(!existing.entry && entryVal) existing.entry = entryVal;
            if(!existing.customerId && custVal) existing.customerId = custVal;
            if(accVal && (!existing.acct || accVal.length >= 6 || String(x[ka]).includes(' '))) existing.acct = accVal;
            if(!existing.bankAcc && bankVal) existing.bankAcc = bankVal;
            if(!existing.classId && classVal) existing.classId = classVal;
        } else {
            ACC.push(a);
        }

    });

    updateBoxUI();

}

function ingestAccInvoices(t) {
    var fk = {}; t.h.forEach(k => { fk[k] = 1 });
    var ke = pick(fk, ['entry no','entry','source entry no','code']);
    var ki = pick(fk, ['invoice no','invoice','inv','លេខវិក្កយបត្រ','លេខវិក័យបត្រ','bill']);
    var ka = pick(fk, ['receive to cash','cash acc','amount','credit','ចំនួន','total']);
    var kd = pick(fk, ['description','desc','particular','ពិពណ៌នា']);
    var kp = pick(fk, ['party','doctor','customer','name','ឈ្មោះ']);

    ACC_INVOICES = [];
    t.rows.forEach((x, i) => {
        var inv = ki ? String(x[ki]||'').trim() : '';
        var en = ke ? String(x[ke]||'').trim() : '';
        var a = ka ? num(x[ka]) : 0;
        var p = kp ? String(x[kp]||'').trim() : (accBy(en) || en);
        var d = kd ? String(x[kd]||'').trim() : '';
        if(isSummaryRow(x, inv)) return;
        if(!inv && !en) return;
        if(a > 0 || inv) {
            ACC_INVOICES.push({
                id: 900000 + i,
                entry: en,
                inv: inv || (en + '-' + (i+1)),
                amt: a,
                paid: a,
                party: p,
                desc: d
            });
        }
    });
}

$('fDebt').onchange = e => {

    var fs = [].slice.call(e.target.files), n = fs.length, got = [], cnt = 0;

    if(!n) return; HDR = {};

    fs.forEach((f, k) => {

        readWB(f, wb => {

            var ts = sheetsOf(wb), dt = null;

            ts.forEach(t => {

                if(hasH(t, /acc|aba/i) && hasH(t, /^name$|ឈ្មោះ/i) && !hasH(t, /invoice|inv|វិក័យ/i)) ingestAcc(t);

                else if(hasH(t, /entry/i) && (hasH(t, /customer/i) || hasH(t, /type/i) || hasH(t, /cash|bank/i) || hasH(t, /prefix/i)) && !hasH(t, /invoice|inv|វិក័យ|វិក្កយ/i)) {
                    var enKey = t.h.find(h => /entry/i.test(h)) || 'Entry No';
                    t.rows.forEach(x => { var en = String(x[enKey]||'').trim(); if(en) HDR[en] = x; });
                    ingestAcc(t);
                } 

                else if(!dt && hasH(t, /invoice|inv|វិក័យ|វិក្កយ|bill|doc/i)) dt = t;

            });

            // Also ingest any additional account sheets (e.g. Sheet3 with accound aba)
            ts.forEach(t => {
                if(t !== dt && (hasH(t, /acc|aba/i) || hasH(t, /^name$|ឈ្មោះ/i))) ingestAcc(t);
            });

            if(!dt) dt = ts.slice().sort((a,b) => b.rows.length - a.rows.length)[0];

            if(dt) {
                dt.name = f.name.replace(/\.[^.]+$/, '').replace(/\s*\(\d+\)$/, '');
                dt.m = smart('debt', dt);
                got[k] = dt;
            }

            cnt++;
            if(cnt === n) {
                FILES = got.filter(Boolean);
                var nStr = fs.map(x => x.name).join(', ');
                FILE_NAMES.debt = nStr;
                localStorage.setItem('debt_file_name', nStr);
                if(ACC && ACC.length > 0) {
                    if(!FILE_NAMES.acc) {
                        FILE_NAMES.acc = nStr;
                        localStorage.setItem('acc_file_name', nStr);
                    }
                    dbSet('acc_state', { name: FILE_NAMES.acc, acc: ACC, count: ACC.length, accInvoices: ACC_INVOICES });
                }
                run();
                dbSet('debt_state', { names: fs.map(x => x.name), files: FILES, hdr: HDR, count: debts.length });
                updateBoxUI();
            }

        });

    });

};

// 4. DATA BUILDER & MATCHER

// ============================================================================

function isSummaryRow(x, inv) {
    var str = Object.keys(x).map(k => String(x[k] == null ? '' : x[k]).trim()).filter(Boolean).join(' ').toLowerCase();
    if(/\b(total|subtotal|grand\s*total|sum\b|balance|bal\b|paid\b|amount\s*paid|ending\s*balance)\b/i.test(str)) return true;
    if(/(សរុប|នៅសល់|បានសង|ប្រាក់សរុប|ជំពាក់សរុប|ចំនួនសរុប|ទឹកប្រាក់សរុប)/i.test(str)) return true;
    if(!inv && !/(inv|lf|pt|bridge|crown|veneer|post|metal|zirconia)/i.test(str)) return true;
    return false;
}

function partyFor(t) {

    var nm = (t.name || '').toLowerCase(), i;

    for(i=0; i<ACC.length; i++) {
        var e = (ACC[i].entry || '').toLowerCase();
        if(e && (nm === e || nm.indexOf(e) > -1)) return ACC[i].name;
        var cid = (ACC[i].customerId || '').toLowerCase();
        if(cid && (nm === cid || nm.indexOf(cid) > -1)) return ACC[i].name;
    }

    if(t.m && t.m.entry) {
        var s = {};
        t.rows.forEach(r => { var val = String(r[t.m.entry]||'').trim(); if(val) s[val] = 1; });
        for(i=0; i<ACC.length; i++) {
            if(ACC[i].entry && s[ACC[i].entry]) return ACC[i].name;
            if(ACC[i].customerId && s[ACC[i].customerId]) return ACC[i].name;
        }
    }

    return t.name || '';

}

function accBy(e) {
    if(!e) return '';
    for(var i=0; i<ACC.length; i++) {
        if((ACC[i].entry && ACC[i].entry === e) || (ACC[i].customerId && ACC[i].customerId === e)) return ACC[i].name;
    }
    return '';
}

function build() {

    var a = RAW.aba, m; debts = [];

    FILES.forEach((t, fi) => {

        m = t.m; var pf = partyFor(t), names = {}; t.used = 0;

        t.rows.forEach((x, i) => {

            var v = m.db ? num(x[m.db]) : (num(x[m.cr]) || num(x[m.bal])), en = m.entry ? String(x[m.entry]||'').trim() : '';

            // Invoice No detection
            var inv = String(m.inv ? (x[m.inv]||'') : '').trim();

            // Intelligent fallback: if inv is empty or was identical to Entry No
            if(!inv || (en && inv === en)) {
                for(var k in x) {
                    if(k !== m.entry && x[k] != null) {
                        var val = String(x[k]).trim();
                        if(/^INV[\s\-_]?[A-Za-z0-9\-]*\d+/i.test(val) || (/^[A-Za-z]{1,6}[-\s]?[A-Za-z0-9\-]*\d{3,}$/.test(val) && val !== en)) {
                            inv = val;
                            break;
                        }
                    }
                }
            }

            // Exclude summary/total/balance rows or rows without an invoice number
            if(isSummaryRow(x, inv)) return;
            if(!inv) return;

            if(!en && t.name) {
                var mOr = t.name.match(/OR\d+/i);
                if(mOr) en = mOr[0];
            }

            var hParty = HDR[en] ? (HDR[en]['Customer ID'] || HDR[en]['Customer Name'] || HDR[en]['Customer'] || '') : '';
            var p = (m.party ? String(x[m.party]||'').trim() : '') || x['Customer Name'] || accBy(en) || accBy(hParty) || hParty || (en && !en.includes(',') ? en : '') || pf;
            if(p && p.includes(',') && !/^C\d{4,}/i.test(p)) p = p.split(',')[0].trim();

            if(!en && p) {
                var aItem = ACC.find(ac => (ac.name && (ac.name === p || p.indexOf(ac.name) > -1 || ac.name.indexOf(p) > -1)) || (ac.customerId && ac.customerId === p));
                if(aItem && aItem.entry) en = aItem.entry;
            }
            if(!en && p) {
                for(var kH in HDR) {
                    var rCust = HDR[kH]['Customer ID'] || HDR[kH]['Customer Name'] || HDR[kH]['Customer'] || '';
                    if(rCust === p) { en = kH; break; }
                }
            }

            if(!(v > 0) || !p) return;

            t.used++; names[p] = 1;

            var dVal = pd(x[m.date] || x['Date']);
            if(!dVal && en && HDR[en]) {
                var hDateCol = pick(HDR[en], ['date', 'កាល']);
                if(hDateCol) dVal = pd(HDR[en][hDateCol]);
            }

            var refVal = x['Reference'] || x['ref'] || (m.ref ? String(x[m.ref]||'').trim() : '');
            var modVal = x['Module'] || 'AR-IN';
            var descVal = x['Description'] || (m.desc ? String(x[m.desc]||'') : '') || x['Remark'] || '';
            var custIdVal = x['Customer ID'] || (p.match(/^([A-Z]\d{4,})/i) ? p.match(/^([A-Z]\d{4,})/i)[1] : '');

            debts.push({
                id: fi*100000+i,
                no: x['No'] || (i+1),
                module: modVal,
                inv: inv,
                ref: refVal,
                date: dVal,
                party: p,
                custId: custIdVal,
                amt: v,
                runBal: x['Running Balance'] != null ? x['Running Balance'] : null,
                entry: en,
                desc: descVal
            });

        });

        t.displayNames = Object.keys(names).join(', ');

    });

    if(a) {

        m = M.aba;

        aba = a.rows.map((x, i) => { return { id: i, date: pd(x[m.date]), text: Object.keys(x).map(k => typeof x[k] === 'string' ? x[k] : '').join(' '), cells: Object.keys(x).map(k => x[k] instanceof Date ? '' : String(x[k])), ref: String(x[m.ref]||''), amt: num(x[m.cr]) || num(x[m.am]) }; }).filter(t => t.amt > 0 && t.date);

    }

    updateBoxUI();
    drawMap();

}

function aliases(p) { var out = [p], m = p.match(/^([^(]*)\((.*)\)/); if(m) { out.push(m[1]); out.push(m[2].replace(/[-\d\s]+$/, '')); } return out.map(s => s.toLowerCase().replace(/\s+/g,'')).filter(s => s.length >= 3); }

function tok(n, txt) { var w = n.toLowerCase().split(/[\s()\/\-,]+/).filter(x => x.length >= 3 && !/^\d+$/.test(x)); var s = txt.toLowerCase(), c = w.filter(x => s.indexOf(x) > -1).length; return w.length >= 2 ? c >= 2 : (w.length === 1 && c === 1 && w[0].length >= 5); }

function findDoc(A, docs, names) {
    if(A.name && docs[A.name]) return docs[A.name];
    var n = (A.name||'').toLowerCase().replace(/\s+/g,''), i, D;
    if(n.length >= 3) for(i=0; i<names.length; i++) { D = docs[names[i]]; if(D.al && D.al.some(a => a.indexOf(n) > -1 || n.indexOf(a) > -1)) return D; }
    if(A.entry) for(i=0; i<names.length; i++) { D = docs[names[i]]; if((D.entry && D.entry === A.entry) || (D.customerId && D.customerId === A.entry) || (D.inv && D.inv.some(v => v.entry === A.entry || v.inv === A.entry))) return D; }
    var tm = names.filter(p => tok(p, A.name) || tok(A.name, p)); return tm.length === 1 ? docs[tm[0]] : null;
}

function run() {

    build();

    if(FILES.length && !debts.length) { $('out').innerHTML = '<div class="card mu" style="text-align:center">⚠️ រកមិនឃើញចំនួនទឹកប្រាក់ សូមពិនិត្យជួរឈរ</div>'; return; }

    if(!debts.length && !aba.length && !ACC.length) { $('out').innerHTML = '<div class="card mu" style="text-align:center">សូមផ្ទុកឯកសារ ABA និង វិក័យបត្រ</div>'; return; }

    var from = $('dFrom').value ? new Date($('dFrom').value) : null, to = $('dTo').value ? new Date($('dTo').value+'T23:59:59') : new Date(8.64e15);
    var docs = {}, names = [];

    // 1. If debts exist, extract customers in EXACT sequential order of appearance in the file! (តាមលំដាប់ ចាប់ពី C00007...)
    debts.forEach(d => {
        var pName = d.party || d.entry || 'គ្មានឈ្មោះ';
        if(!docs[pName]) {
            var accMatch = ACC.find(a => (a.name && (a.name === pName || pName.indexOf(a.name) > -1 || a.name.indexOf(pName) > -1)) || (a.customerId && (a.customerId === pName || a.customerId === d.custId)));
            docs[pName] = {
                name: pName,
                accItem: accMatch || null,
                entry: (accMatch && accMatch.entry) || d.entry || '',
                customerId: (accMatch && accMatch.customerId) || d.custId || '',
                bankAcc: (accMatch && (accMatch.bankAcc || accMatch.acct)) || '',
                inv: [],
                pay: [],
                al: aliases(pName)
            };
            names.push(pName);
        }
        docs[pName].inv.push(d);
    });

    // 2. Append any remaining accounts from ACC that didn't have invoices in debts
    if(ACC && ACC.length) {
        ACC.forEach((a, idx) => {
            var dn = String(a.name || a.customerId || a.entry || ('គណនី ' + (idx + 1))).trim();
            if(!docs[dn]) {
                docs[dn] = {
                    name: dn,
                    accItem: a,
                    entry: a.entry || '',
                    customerId: a.customerId || '',
                    bankAcc: a.bankAcc || a.acct || '',
                    inv: [],
                    pay: [],
                    al: aliases(dn)
                };
                names.push(dn);
            }
        });
    }

    // 3. If any account in docs has 0 invoices from debts, but has invoices in ACC_INVOICES (from Box 3), attach them!
    if(ACC_INVOICES && ACC_INVOICES.length) {
        names.forEach(n => {
            var D = docs[n];
            if(!D.inv || D.inv.length === 0) {
                var matchedAccInvs = ACC_INVOICES.filter(ai => {
                    if(D.entry && ai.entry && D.entry === ai.entry) return true;
                    if(D.customerId && ai.entry && D.customerId === ai.entry) return true;
                    if(D.name && ai.party && D.name === ai.party) return true;
                    if(D.name && ai.entry && D.name === ai.entry) return true;
                    return false;
                });
                if(matchedAccInvs.length > 0) {
                    matchedAccInvs.forEach(ai => {
                        D.inv.push({
                            id: ai.id,
                            no: D.inv.length + 1,
                            module: 'AR-IN',
                            inv: ai.inv,
                            ref: '',
                            date: null,
                            amt: ai.amt,
                            runBal: 0,
                            paidInOR: ai.paid,
                            party: D.name,
                            entry: D.entry || ai.entry,
                            desc: ai.desc
                        });
                    });
                }
            }
        });
    }

    // 4. Calculate sequential No and cumulative Running Balance for each customer
    names.forEach(n => {
        var D = docs[n];
        var running = 0;
        D.inv.forEach((v, idx) => {
            v.no = idx + 1;
            running += v.amt;
            v.runBal = Math.round(running * 100) / 100;
        });
    });

    var unmatched = [];

    // 3. Match ABA
    aba.forEach(t => {
        if(t.date > to) return;
        var low = t.text.toLowerCase().replace(/\s+/g, ''), hit = assign[t.id] && docs[assign[t.id]] ? docs[assign[t.id]] : null;

        if(!hit && ACC.length) {
            for(var j = 0; j < ACC.length && !hit; j++) {
                var A = ACC[j];
                var accNum = (A.acct || A.bankAcc || '').replace(/\D/g, '');
                if(accNum && accNum.length >= 4 && t.cells.some(c => c.replace(/\D/g, '').indexOf(accNum) > -1)) {
                    hit = docs[A.name] || findDoc(A, docs, names);
                }
            }
        }

        if(!hit) {
            for(var i = 0; i < names.length && !hit; i++) {
                var D2 = docs[names[i]];
                if(D2.al.some(a => low.indexOf(a) > -1) || D2.inv.some(v => { var k = v.inv.toLowerCase().replace(/\s+/g, ''); return k.length >= 5 && low.indexOf(k) > -1; })) hit = D2;
            }
        }

        if(!hit) {
            var tm = names.filter(n => tok(n, t.text));
            if(tm.length === 1) hit = docs[tm[0]];
        }

        if(hit) hit.pay.push(t); else unmatched.push(t);
    });

    var tot = {owed: 0, paid: 0, rem: 0};

    names.forEach(n => {
        var D = docs[n];
        D.inv.sort((a, b) => (a.date || 0) - (b.date || 0));

        var before = 0, per = 0, lastD = null;
        D.pay.forEach(t => {
            if(from && t.date < from) before += t.amt;
            else { per += t.amt; if(!lastD || t.date > lastD) lastD = t.date; }
        });

        D.before = before; D.per = per; D.lastD = lastD || to; D.owed = 0;

        D.inv.forEach(v => {
            if(v.paidInOR != null && v.paidInOR > 0 && per === 0 && before === 0) {
                v.pb = 0;
                v.pp = v.paidInOR;
                v.rem = Math.max(0, v.amt - v.pp);
            } else {
                var a = Math.min(v.amt, before);
                v.pb = a;
                before -= a;
                var b = Math.min(v.amt - v.pb, per);
                v.pp = b;
                per -= b;
                v.rem = Math.max(0, v.amt - v.pb - v.pp);
            }
            D.owed += v.amt;
        });

        D.extra = before + per;
        D.paidTotal = D.inv.reduce((s, v) => s + (v.pb||0) + (v.pp||0), 0);
        D.paidPer = D.inv.reduce((s, v) => s + (v.pp||0), 0);
        D.rem = Math.max(0, D.owed - D.paidTotal);

        tot.owed += D.owed; tot.paid += D.paidTotal; tot.rem += D.rem;
    });

    res = {docs: docs, names: names, unmatched: unmatched, tot: tot, from: from};
    render();
}

function saveWB(wb, fn) { try { XLSX.writeFile(wb, fn); } catch(e) { alert('មានបញ្ហាក្នុងការទាញយកឯកសារ៖ ' + (e.message || '')); } }

function parseTx(s) {

    s = String(s||'').replace(/\s+/g, ' ').trim(); var acc = '', name = '', m = s.match(/\(\s*(\d[\d ]{5,}\d)\s*\)/);

    if(m) acc = m[1].replace(/\s+/g, ' '); else { m = s.match(/\b\d{8,}\b/); if(m) acc = m[0]; }

    m = s.match(/\b(?:FROM|BY)\s+(.+?)(?=\s*\(|\s+\d{6,}|\s+ORIGINAL|\s+BANK|$)/i);

    name = m ? m[1].trim() : s.replace(/^[A-Za-z]{3} \d{1,2}, \d{4}\s*/, '').slice(0, 60);

    return {name: name, acc: acc};

}

function mkWB(s1, s2) { var wb = XLSX.utils.book_new(); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s1), 'SHEET1'); XLSX.utils.book_append_sheet(wb, XLSX.utils.aoa_to_sheet(s2), 'SHEET2'); return wb; }

function buildOR(items) {

    var cur = $('cur').value || 'USD', rate = +$('rate').value || 1;
    var s1 = [[
        'Entry No',
        'Type',
        'Date (dd-MMM-YYYY)',
        'Prefix',
        'Customer ID',
        'Cash/Bank Account ID',
        'Received By',
        'Class ID',
        'Reference',
        'Remark',
        'Payment Method',
        'Payment Reference',
        'Currency ID',
        'Exchange Rate'
    ]];
    var s2 = [[
        'Entry No',
        'Invoice No/Account ID',
        'Job No',
        'Description',
        'Discount',
        'Receive to Cash Acc./Amount'
    ]];
    var seen = {};

    items.forEach(x => {

        var v = x.v;
        var e = String(v.entry || '').trim();

        // Ensure Entry No is always a clean OR code (never merged names)
        if(!e || !/^OR\d+/i.test(e)) {
            var docName = String(x.n || v.party || '').split(',')[0].trim();
            var acc = ACC.find(a => (a.name && (a.name === docName || docName.toLowerCase().indexOf(a.name.toLowerCase()) > -1 || a.name.toLowerCase().indexOf(docName.toLowerCase()) > -1)) || (a.customerId && (a.customerId === docName || a.customerId === v.party)) || (a.entry && a.entry === docName));
            if(acc && acc.entry) e = acc.entry;

            if(!e || !/^OR\d+/i.test(e)) {
                for(var k in HDR) {
                    var rCust = HDR[k]['Customer ID'] || HDR[k]['Customer Name'] || HDR[k]['Customer'] || '';
                    if(rCust === docName || (acc && rCust === acc.customerId)) { e = k; break; }
                }
            }
            if(!e || !/^OR\d+/i.test(e)) {
                var mOr = docName.match(/OR\d+/i) || (String(v.inv||'')).match(/OR\d+/i);
                if(mOr) e = mOr[0];
            }
            if(!e) {
                e = docName;
            }
        }

        var h = HDR[e] || {};

        if(!seen[e]) {
            seen[e] = 1;

            var acc = ACC.find(a => (a.entry && a.entry === e) || (a.customerId && a.customerId === e) || (a.name && (a.name === x.n || x.n.toLowerCase().indexOf(a.name.toLowerCase()) > -1)));

            var hDate = h['Date (dd-MMM-YYYY)'] || h['Date'] || h['date'] || v.date || (x.D && x.D.lastD) || new Date();
            var entryDateStr = dmy(hDate);

            var type = h['Type'] || h['type'] || 'Apply to Sale Invoice';
            var prefix = h['Prefix'] || h['prefix'] || 'DEFAULT';
            var custId = h['Customer ID'] || h['Customer'] || h['customer id'] || (acc && (acc.customerId || acc.entry)) || (x.n && !x.n.includes(',') ? x.n : '') || e;
            var bankAcc = h['Cash/Bank Account ID'] || h['Cash/Bank Account'] || h['Bank Account ID'] || (acc && acc.bankAcc) || $('bank').value || '';
            var recBy = h['Received By'] || '';
            var classId = h['Class ID'] || h['Class'] || (acc && acc.classId) || 'KHEMA88888';
            var ref = h['Reference'] || '';
            var remark = h['Remark'] || ('ABA: ' + entryDateStr);
            var payMethod = h['Payment Method'] || '';
            var payRef = h['Payment Reference'] || '';
            var curId = h['Currency ID'] || cur;
            var exRate = h['Exchange Rate'] || rate;

            s1.push([
                e,
                type,
                entryDateStr,
                prefix,
                custId,
                bankAcc,
                recBy,
                classId,
                ref,
                remark,
                payMethod,
                payRef,
                curId,
                exRate
            ]);
        }

        var invNo = v.inv;
        var paid = (v.pp != null && v.pp > 0) ? v.pp : (v.paidInOR != null && v.paidInOR > 0 ? v.paidInOR : ((v.pb != null && v.pb > 0) ? v.pb : 0));
        var amt = Math.round(paid * 100) / 100;

        s2.push([
            e,
            invNo,
            '',
            v.desc || '',
            0,
            amt
        ]);

    });

    return mkWB(s1, s2);

}

function buildJV(items) {

    var cur = $('cur').value, rate = +$('rate').value || 1, bank = $('bank').value, s1 = [['Entry No','Date (dd-MMM-YYYY)','Prefix','Source Entry No','Reference','Remark','Currency ID','Exchange Rate']], s2 = [['Entry No','Date (dd-MMM-YYYY)','Account ID','Account Name','Class ID','Description','Debit','Credit','Job No','Job Task No','Job Planning Line']];

    items.forEach((x, i) => {

        var v = x.v, k = i+1, ds = dmy(x.D.lastD || v.date), rm = 'Payment from ' + x.n + ' (' + v.inv + ')';
        var paid = (v.pp != null && v.pp > 0) ? v.pp : (v.paidInOR != null && v.paidInOR > 0 ? v.paidInOR : ((v.pb != null && v.pb > 0) ? v.pb : 0));
        var a = Math.round(paid * 100) / 100;

        s1.push([k, ds, '', v.entry||'', v.inv, rm, cur, rate]); s2.push([k, ds, '', bank, '', rm, a, 0, '', 0, 0]); s2.push([k, ds, '', x.n, '', rm, 0, a, '', 0, 0]);

    });

    return mkWB(s1, s2);

}

            ACC_INVOICES = accData.accInvoices || [];
            FILE_NAMES.acc = accData.name || localStorage.getItem('acc_file_name') || 'ឯកសារគណនី';
            localStorage.setItem('acc_file_name', FILE_NAMES.acc);
            shouldRun = true;
        }

        if(debtData && debtData.files && debtData.files.length) {
            FILES = debtData.files;
            HDR = debtData.hdr || {};
            var nStr = (debtData.names && debtData.names.join(', ')) || FILES.map(x => x.name).join(', ');
            FILE_NAMES.debt = nStr || localStorage.getItem('debt_file_name') || 'ឯកសារវិក័យបត្រ';
            localStorage.setItem('debt_file_name', FILE_NAMES.debt);
            shouldRun = true;
        }

        if(abaData && abaData.raw) {
            RAW.aba = abaData.raw;
            M.aba = abaData.m || (RAW.aba && RAW.aba.m) || {};
            FILE_NAMES.aba = abaData.name || localStorage.getItem('aba_file_name') || 'ឯកសារ ABA';
            localStorage.setItem('aba_file_name', FILE_NAMES.aba);
            shouldRun = true;
        }

        if(shouldRun) {
            run();
        } else {
            updateBoxUI();
        }
    }).catch(err => {
        console.warn('restoreSavedData error:', err);
        updateBoxUI();
    });
}

restoreSavedData();

window.addEventListener('visibilitychange', () => {
    if(document.visibilityState === 'visible' && (!RAW.aba || !FILES.length)) {
        restoreSavedData();
    }
});

window.addEventListener('focus', () => {
    if(!RAW.aba || !FILES.length) {
        restoreSavedData();
    }
});

</script>
